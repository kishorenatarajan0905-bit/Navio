name: Build Navio APK

on:
  push:
    branches: [main]
    paths: ["companion-app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run logic mirror tests
        run: node companion-app/verify/logic-mirror.test.js

      - name: Run unit tests and build debug APK
        working-directory: companion-app
        run: gradle test assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navio-debug-apk
          path: companion-app/app/build/outputs/apk/debug/*.apk
