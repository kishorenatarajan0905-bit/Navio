<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<title>Bike Nav</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{--ink:#14202b;--ink2:#1f2f3d;--paper:#f6f5f0;--line:#dcdad0;--mut:#69727a;--go:#12a150;--stop:#d92d20;--sig:#ff6a1f;--route:#0b7285;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#map{position:fixed;inset:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 14px;font-weight:600;background:var(--ink);color:#fff;transition:transform .08s,opacity .2s}
button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.go{background:var(--go)}button.stop{background:var(--stop)}button.sig{background:var(--sig)}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
/* top bar */
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:900;display:flex;gap:8px;max-width:560px;margin:auto}
.search{flex:1;position:relative}
.search input{padding:13px 14px;border:0;box-shadow:0 2px 12px rgba(20,32,43,.25);border-radius:12px}
#results{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(20,32,43,.25);overflow:hidden;max-height:40vh;overflow-y:auto}
#results div{padding:11px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}
#results div:hover{background:#f2f4f5}#results .none{color:var(--mut);cursor:default}
.pill{display:flex;align-items:center;gap:7px;background:#fff;border-radius:12px;padding:0 13px;box-shadow:0 2px 12px rgba(20,32,43,.25);font-weight:600;font-size:13px;white-space:nowrap;border:0;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--stop)}.pill.on .dot{background:var(--go)}
.fab{position:fixed;right:10px;z-index:800;width:46px;height:46px;padding:0;background:#fff;color:var(--ink);box-shadow:0 2px 12px rgba(20,32,43,.25);font-size:20px}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(20,32,43,.3);padding:8px 14px max(14px,env(safe-area-inset-bottom));max-width:560px;margin:auto;max-height:70vh;overflow-y:auto}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.step{flex:1;font-size:12px;color:var(--mut);padding:6px 8px;border-radius:8px;background:#ebeae2;text-align:center}
.step.done{background:#d9f2e3;color:#0b6b35}.step.now{background:var(--ink);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.msg{color:var(--mut);margin:0 0 10px}
.sum{display:flex;gap:18px;margin:0 0 10px}.sum b{font-size:22px;display:block}.sum span{font-size:12px;color:var(--mut)}
.seg{display:flex;background:#ebeae2;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{background:none;color:var(--mut);padding:10px}.seg button.act{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;font-weight:600;padding:6px 0}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:var(--mut)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}.chk input{width:auto}
#logs{height:130px;overflow-y:auto;background:var(--ink);color:#7ee2a8;font:11px/1.5 ui-monospace,Menlo,monospace;padding:8px;border-radius:10px;margin-top:10px}
/* ride HUD */
#hud{display:none}.riding #hud{display:block}.riding #plan{display:none}
.hud{background:var(--ink);color:#fff;border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;margin-bottom:10px}
#hArrow{font-size:60px;line-height:1;grid-row:span 2;width:80px;text-align:center;color:var(--sig)}
#hDist{font-size:34px;font-weight:700}#hRoad{color:#b9c4cc;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstats{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--mut)}.hstats b{color:var(--ink);font-size:18px}
.mk{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* compact unit */
body{font-size:13px}
.sheet{padding:8px 10px max(10px,env(safe-area-inset-bottom));max-height:55vh;border-radius:16px 16px 0 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:600}
#headTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.min-btn{padding:2px 10px;background:#ebeae2;color:var(--ink);border-radius:8px;font-size:16px;line-height:1.2}
.sheet.min>:not(.head){display:none}.sheet.min .head{margin:0}
button{padding:8px 10px;border-radius:10px;font-size:13px}
.steps{gap:4px;margin-bottom:8px}.step{font-size:11px;padding:4px 2px;border-radius:6px}
.msg{margin:0 0 6px;font-size:12px}
.sum{gap:14px;margin:0 0 6px}.sum b{font-size:16px}.sum span{font-size:11px}
.seg{margin-bottom:6px}.seg button{padding:6px}
.hud{padding:8px 10px;margin-bottom:6px;gap:0 10px}#hArrow{font-size:38px;width:50px}#hDist{font-size:22px}
.hstats{margin-bottom:6px}.hstats b{font-size:15px}
input,select{padding:7px;font-size:13px}label{margin:6px 0 3px}
#logs{height:90px}
@media(min-width:700px){.sheet{left:12px;right:auto;bottom:12px;width:290px;margin:0;border-radius:16px;max-height:62vh}}

/* collapsed dock */
.dock{display:none;gap:6px}
.dock button{width:42px;height:42px;padding:0;display:grid;place-items:center;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;position:relative}
.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button.on::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--go)}
.dock button.dim{opacity:.5}
.dock button.live{background:var(--stop);color:#fff;border-color:var(--stop)}
.sheet.min>:not(.dock){display:none}
.sheet.min>.dock{display:flex}
.riding .sheet.min>#hud{display:block;min-width:250px}
.sheet.min{padding:6px;left:50%;right:auto;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:auto;max-width:96vw;margin:0;border-radius:16px;overflow:visible}
@media(min-width:700px){.sheet.min{left:12px;transform:none;bottom:12px;width:auto}}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="search">
    <input id="q" type="search" placeholder="Search a place" aria-label="Search a place" autocomplete="off">
    <div id="results" hidden></div>
  </div>
  <button class="pill" id="bleBtn"><span class="dot"></span><span id="bleTxt">Connect bike</span></button>
</div>
<button class="fab" id="locBtn" style="top:calc(max(10px,env(safe-area-inset-top)) + 62px)" aria-label="Use my location as start" title="Use my location as start">&#9678;</button>

<div class="toast" id="toast" role="status"></div>

<div class="sheet min" id="sheet">
  <div class="head"><span id="headTxt">Bike Nav</span><button class="min-btn" id="minBtn" aria-label="Collapse or expand panel" title="Collapse / expand">&#8212;</button></div>

  <div id="plan">
    <div class="steps">
      <div class="step" id="s1">1 Connect</div><div class="step" id="s2">2 Pick route</div><div class="step" id="s3">3 Ride</div>
    </div>
    <p class="msg" id="hint">Tap the map to set your start, then tap again for your destination.</p>
    <div class="sum" id="sum" hidden><div><b id="sumKm">-</b><span>distance</span></div><div><b id="sumMin">-</b><span>est. time</span></div><div><b id="sumPts">-</b><span>via</span></div></div>
    <div class="row" style="margin-bottom:8px">
      <button class="ghost" id="swapBtn">Swap start/end</button>
      <button class="ghost" id="clearBtn">Clear</button>
    </div>
    <div class="seg" id="vehSeg"><button class="act" data-v="bike">Bike route</button><button data-v="car">Car route</button></div>
    <button id="routeBtn" class="sig" style="width:100%;margin-bottom:10px">Get route</button>
    <div class="seg" id="modeSeg"><button class="act" data-m="live">Live GPS ride</button><button data-m="sim">Practice (simulated)</button></div>
    <div id="simBox" hidden>
      <label>Practice speed: <span id="mv">10</span>x</label>
      <input type="range" id="mult" min="1" max="50" value="10" style="padding:0">
    </div>
    <button id="rideBtn" class="go" style="width:100%;margin-top:10px" disabled>Start ride</button>

    <details>
      <summary>Advanced</summary>
      <label>Map style</label>
      <select id="mapStyle"><option value="esri">Streets (Esri)</option><option value="osm">OpenStreetMap</option><option value="google">Google tiles (demo only)</option></select>
      <label>OpenRouteService key (optional, better routes)</label>
      <input type="password" id="orsKey" placeholder="Paste free key from openrouteservice.org" autocomplete="off">
      <div class="row" style="margin-top:10px"><button class="ghost" id="resendBtn">Resend map to bike</button><button class="ghost" id="testBtn">Send test packet</button></div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="manualOverride"> Manual override (testing only)</label>
      <label>Distance to turn (m)</label><input type="number" id="distInput" value="150" min="0">
      <label>Turn type</label>
      <select id="turnInput"><option value="0">Straight</option><option value="1">Left</option><option value="2">Right</option><option value="3">Slight left</option><option value="4">Slight right</option><option value="5">U-turn</option><option value="6">Arrived</option></select>
      <label>Speed (km/h)</label><input type="number" id="speedInput" value="18" min="0">
      <label>Road name</label><input type="text" id="roadInput" value="College Road" maxlength="20">
      <div id="logs">Ready.</div>
    </details>
  </div>

  <div id="hud">
    <div class="hud"><div id="hArrow">&uarr;</div><div id="hDist">-</div><div id="hRoad">-</div></div>
    <div class="hstats"><div><b id="hSpd">0</b> km/h</div><div><b id="hLeft">-</b> left</div><div id="hSrc"></div></div>
    <button class="stop" id="stopBtn" style="width:100%">End ride</button>
  </div>
  <div class="dock" id="dock">
    <button id="dBle" title="Connect bike" aria-label="Connect bike"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></button>
    <button id="dRoute" title="Get route" aria-label="Get route"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 17V9a4 4 0 0 1 4-4h6"/></svg></button>
    <button id="dRide" title="Start ride" aria-label="Start ride"><svg viewBox="0 0 24 24" id="dRideIco"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button id="dSet" title="Settings and details" aria-label="Open settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>if(typeof L==="undefined"){document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')}</script>
<script>
const SERVICE_UUID="6e400001-b5a3-f393-e0a9-e50e24dcca9e",CHAR_UUID="6e400002-b5a3-f393-e0a9-e50e24dcca9e",GOOGLE_KEY="";
const $=id=>document.getElementById(id);
if(typeof L==="undefined"){document.getElementById("map").innerHTML='<div style="padding:90px 20px;text-align:center;font-weight:600">Map library could not load.<br><span style="font-weight:400;color:#69727a">Check your internet connection and open this file in Chrome or Edge from a normal web address (https:// or localhost).</span></div>';throw new Error("Leaflet not loaded")}
let device=null,server=null,characteristic=null,startM=null,endM=null,routeLine=null,routeCoords=[],routeCum=[],routeDistM=0;
let simTimer=null,simIndex=0,sending=false,simDistM=0,simLastTs=0,simSpd=0,tileLayer=null,gpsMarker=null,liveId=null,mode="live",wakeLock=null;
const CHUNK=46,OVERLAP=5,TRIGGER=30;let fullPts=[],chunkEnd=0,chunkBusy=false;
const ARROWS=["\u2191","\u2190","\u2192","\u2196","\u2197","\u21B6","\u2691"];

/* ---------- helpers ---------- */
function log(m){const l=$("logs");l.innerHTML+=`<br>[${new Date().toLocaleTimeString()}] ${m}`;l.scrollTop=l.scrollHeight}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000);log(m)}
const toRad=d=>d*Math.PI/180,toDeg=r=>r*180/Math.PI,round6=v=>Math.round(v*1e6)/1e6,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function haversine(p,q){const R=6371000,a=toRad(q.lat-p.lat),b=toRad(q.lon-p.lon),x=Math.sin(a/2)**2+Math.cos(toRad(p.lat))*Math.cos(toRad(q.lat))*Math.sin(b/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(p,q){const f1=toRad(p.lat),f2=toRad(q.lat),dl=toRad(q.lon-p.lon);return(toDeg(Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl)))+360)%360}
const angleDiff=(a,b)=>((b-a+540)%360)-180;
const sanitizeRoad=t=>String(t||"").replace(/[^A-Za-z0-9 .,_-]/g,"").substring(0,20).trim()||"Route";
const fmtKm=m=>m>=1000?(m/1000).toFixed(1)+" km":Math.round(m)+" m";
function computeCum(c){const a=[0];for(let i=1;i<c.length;i++)a.push(a[i-1]+haversine(c[i-1],c[i]));return a}
function dedupe(p){const o=[];for(const q of p){const l=o[o.length-1];if(!l||l.lat!==q.lat||l.lon!==q.lon)o.push(q)}return o}

/* ---------- map ---------- */
const map=L.map("map",{zoomControl:false}).setView([11.0168,76.9558],14);
L.control.zoom({position:"bottomright"}).addTo(map);
function applyStyle(){
  const s=$("mapStyle").value;if(tileLayer)map.removeLayer(tileLayer);
  const c=s==="google"?["https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",{subdomains:["mt0","mt1","mt2","mt3"],maxZoom:20,attribution:"Google (demo only)"}]
   :s==="osm"?["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}]
   :["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}];
  tileLayer=L.tileLayer(c[0],c[1]).addTo(map);try{localStorage.setItem("bn_style",s)}catch(e){}
}
try{const s=localStorage.getItem("bn_style");if(s)$("mapStyle").value=s}catch(e){}
$("mapStyle").onchange=applyStyle;applyStyle();

const pin=c=>L.divIcon({className:"",html:`<div class="mk" style="background:${c}"></div>`,iconSize:[26,26],iconAnchor:[6,26]});
function makeMarker(ll,color,label){
  const m=L.marker(ll,{icon:pin(color),draggable:true}).addTo(map).bindTooltip(label);
  m.on("dragend",()=>{clearRoute();toast("Pin moved. Get the route again.");refresh()});return m}
map.on("click",e=>{
  if(document.body.classList.contains("riding"))return;
  if(!startM)startM=makeMarker(e.latlng,"#12a150","Start");
  else if(!endM)endM=makeMarker(e.latlng,"#d92d20","Destination");
  else{clearAll();startM=makeMarker(e.latlng,"#12a150","Start")}
  clearRoute();refresh()});

function clearRoute(){if(routeLine)map.removeLayer(routeLine);routeLine=null;routeCoords=[];routeCum=[];fullPts=[];chunkEnd=0;routeDistM=0;$("sum").hidden=true}
function clearAll(){[startM,endM].forEach(m=>m&&map.removeLayer(m));startM=endM=null;clearRoute();refresh()}
function drawRoute(col){if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(routeCoords.map(p=>[p.lat,p.lon]),{color:col,weight:6,opacity:.9}).addTo(map);map.fitBounds(routeLine.getBounds(),{paddingBottomRight:[20,$("sheet").classList.contains("min")?90:(innerWidth<700?220:20)],paddingTopLeft:[innerWidth<700||$("sheet").classList.contains("min")?20:320,80]})}
$("clearBtn").onclick=clearAll;
$("swapBtn").onclick=()=>{if(!startM||!endM)return toast("Set both pins first.");const a=startM.getLatLng();startM.setLatLng(endM.getLatLng());endM.setLatLng(a);clearRoute();refresh()};

/* ---------- UI state ---------- */
function connected(){return !!(characteristic&&server&&server.connected)}
function refresh(){
  const c=connected(),has=routeCoords.length>0;
  $("s1").className="step "+(c?"done":"now");
  $("s2").className="step "+(has?"done":c?"now":"");
  $("s3").className="step "+(has&&c?"now":"");
  $("hint").textContent=!c?"Connect your bike first, then plan the route."
    :!startM?"Tap the map to set your start, or use the location button."
    :!endM?"Now tap your destination."
    :!has?"Pins set. Get the route to continue.":"Route ready. Choose a ride mode and start.";
  $("headTxt").textContent=routeCoords.length?`Route ready · ${fmtKm(routeDistM)}`:$("hint").textContent;
  $("routeBtn").disabled=!(startM&&endM);updateDock();
  $("rideBtn").disabled=!(has&&c);
  $("bleBtn").classList.toggle("on",c);$("bleTxt").textContent=c?(device&&device.name||"Connected"):"Connect bike";
}
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("act",x===b));$("simBox").hidden=mode!=="sim"});
$("mult").oninput=e=>$("mv").textContent=e.target.value;

/* ---------- search & location ---------- */
async function search(){
  const q=$("q").value.trim(),r=$("results");if(!q)return;r.hidden=false;r.innerHTML='<div class="none">Searching...</div>';
  try{const d=await(await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`)).json();
    r.innerHTML="";if(!d.length){r.innerHTML='<div class="none">No matches. Try a nearby landmark or a city name.</div>';return}
    d.forEach(i=>{const e=document.createElement("div");e.textContent=i.display_name;e.onclick=()=>{map.setView([+i.lat,+i.lon],16);r.hidden=true;$("q").value=i.display_name.split(",")[0]};r.appendChild(e)})
  }catch(err){r.innerHTML='<div class="none">Search failed. Check your connection and try again.</div>'}}
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("q").addEventListener("input",()=>{if(!$("q").value)$("results").hidden=true});
$("locBtn").onclick=()=>{
  if(!navigator.geolocation)return toast("This browser has no location support.");
  toast("Finding you...");
  navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,16);
    if(!startM)startM=makeMarker(ll,"#12a150","Start");else startM.setLatLng(ll);clearRoute();refresh();toast("Start set to your location.")},
    e=>toast("Could not get location: "+e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:0})};

/* ---------- Bluetooth ---------- */
function onDisc(){characteristic=null;stopRide(true);refresh();toast("Bike disconnected.")}
$("bleBtn").onclick=async()=>{
  if(connected()){device.gatt.disconnect();return}
  if(!navigator.bluetooth)return toast("Web Bluetooth needs Chrome or Edge on Android or desktop.");
  try{device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE_UUID]}]});
    device.addEventListener("gattserverdisconnected",onDisc);
    toast("Connecting...");server=await device.gatt.connect();
    characteristic=await(await server.getPrimaryService(SERVICE_UUID)).getCharacteristic(CHAR_UUID);
    toast("Bike connected.");refresh();if(routeCoords.length)initWindow(routeCoords)
  }catch(e){toast("Connection failed: "+e.message);refresh()}};

const sleep=ms=>new Promise(r=>setTimeout(r,ms)),asciiOnly=t=>String(t).replace(/[^\x20-\x7E]/g,""),hex2=n=>n.toString(16).padStart(2,"0").toUpperCase();
let chain=Promise.resolve();
function serialize(j){const r=chain.then(j,j);chain=r.then(()=>{},()=>{});return r}
async function rawWrite(pk){
  for(let i=0;i<5;i++){try{
    if(characteristic.properties&&characteristic.properties.writeWithoutResponse)await characteristic.writeValueWithoutResponse(pk);else await characteristic.writeValue(pk);return
  }catch(e){const m=String((e&&e.message)||e);if(!/in progress|networkerror|not supported|gatt|busy|disconnect/i.test(m)||i===4)throw e;await sleep(40*(i+1))}}}
function sendJson(js){
  if(!connected())return Promise.reject(new Error("Not connected"));
  return serialize(async()=>{const a=asciiOnly(js),b=new TextEncoder().encode(a);let off=0,seq=0;
    while(off<b.length){const cl=Math.min(17,b.length-off),end=off+cl>=b.length?"1":"0";
      await rawWrite(new TextEncoder().encode(hex2(seq)+end+a.slice(off,off+cl)));off+=cl;seq++;
      if(seq>255)throw new Error("packet too large");await sleep(8)}})}

/* ---------- sliding window ---------- */
function initWindow(pts){fullPts=pts;chunkEnd=0;sendChunk(0).then(()=>sendJson(JSON.stringify(buildUpdate(0,false,0)))).then(()=>log("Initial map sent.")).catch(e=>log("Init failed: "+e.message))}
function sendChunk(idx){
  if(chunkBusy)return Promise.resolve();
  const s=Math.max(0,idx-OVERLAP);let e=Math.min(s+CHUNK,fullPts.length);
  if(e<=chunkEnd)return Promise.resolve();
  const pk={t:"R",pts:fullPts.slice(s,e).map(p=>[round6(p.lat),round6(p.lon)])};chunkBusy=true;
  return sendJson(JSON.stringify(pk)).then(()=>{chunkEnd=e;chunkBusy=false;log(`map chunk ${s}-${e}`)}).catch(err=>{chunkBusy=false;log("Chunk failed: "+err.message)})}
function checkUpdate(i){if(chunkEnd-i<=CHUNK-TRIGGER)sendChunk(i)}

/* ---------- route logic ---------- */
function simpleRoute(s,e,n=50){const o=[];for(let i=0;i<=n;i++){const t=i/n,cv=Math.sin(t*Math.PI)*.0004;o.push({lat:round6(s.lat+(e.lat-s.lat)*t+cv),lon:round6(s.lng+(e.lng-s.lng)*t-cv),name:"Route"})}return o}
function plannedSpeed(i){if(routeCoords.length<3)return 18;let sh=0;for(let k=i;k<Math.min(i+6,routeCoords.length-2);k++){const d=Math.abs(angleDiff(bearing(routeCoords[k],routeCoords[k+1]),bearing(routeCoords[k+1],routeCoords[k+2])));if(d>25){sh=Math.min(1,(d-25)/60);break}}return Math.round((22-13*sh)*10)/10}
function distToTurn(i){if(routeCoords.length<3)return 100;let cum=0;for(let k=i;k<routeCoords.length-2;k++){cum+=haversine(routeCoords[k],routeCoords[k+1]);if(Math.abs(angleDiff(bearing(routeCoords[k],routeCoords[k+1]),bearing(routeCoords[k+1],routeCoords[k+2])))>30)return Math.max(20,Math.round(cum))}return Math.max(20,Math.round((routeCum[routeCum.length-1]-routeCum[i])||100))}
function turnType(i){if(routeCoords.length<3)return 0;for(let k=i;k<routeCoords.length-2;k++){const d=angleDiff(bearing(routeCoords[k],routeCoords[k+1]),bearing(routeCoords[k+1],routeCoords[k+2]));if(d<-150||d>150)return 5;if(d<-30)return 1;if(d>30)return 2}return 0}
function buildUpdate(index,manual,spdMeasured){
  const em=manual&&$("manualOverride").checked,si=clamp(index,0,routeCoords.length-1),r=routeCoords[si],nx=routeCoords[Math.min(si+1,routeCoords.length-1)],hdg=bearing(r,nx);
  let dist,turn,spd,road;
  if(em){dist=parseInt($("distInput").value||150);turn=parseInt($("turnInput").value||0);spd=parseFloat($("speedInput").value||18);road=sanitizeRoad($("roadInput").value)}
  else{dist=distToTurn(si);turn=turnType(si);spd=spdMeasured!=null?spdMeasured:plannedSpeed(si);road=sanitizeRoad(r.name||"Route")}
  return{t:"U",lat:round6(r.lat),lon:round6(r.lon),hdg:Math.round(hdg*10)/10,spd:Math.round(spd*10)/10,dist,turn,road}}

$("routeBtn").onclick=async()=>{
  const s=startM.getLatLng(),e=endM.getLatLng(),straight=haversine({lat:s.lat,lon:s.lng},{lat:e.lat,lon:e.lng}),car=vehicle==="car";
  const b=$("routeBtn");b.disabled=true;b.textContent="Finding route...";clearRoute();
  const key=$("orsKey").value.trim(),conv=c=>dedupe(c.map(p=>({lat:round6(p[1]),lon:round6(p[0]),name:"Route"})));let ex=null;
  if(key){try{
    const r=await fetch(`https://api.openrouteservice.org/v2/directions/${car?"driving-car":"cycling-regular"}/geojson`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:key},body:JSON.stringify({coordinates:[[s.lng,s.lat],[e.lng,e.lat]]})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const f=((await r.json()).features||[])[0];
    if(f&&f.geometry.coordinates.length){const sm=f.properties.summary||{};ex={coords:conv(f.geometry.coordinates),dist:sm.distance||0,dur:sm.duration||0,src:"ORS"}}
  }catch(err){log("OpenRouteService failed: "+err.message+" (trying OSRM)")}}
  if(!ex){const q=`${s.lng},${s.lat};${e.lng},${e.lat}?overview=full&geometries=geojson`;
    for(const u of [`https://routing.openstreetmap.de/${car?"routed-car":"routed-bike"}/route/v1/driving/${q}`,`https://router.project-osrm.org/route/v1/driving/${q}`]){try{
      const res=await fetch(u,{cache:"no-store"});if(!res.ok)continue;const d=await res.json();if(d.code!=="Ok")continue;
      const rt=d.routes&&d.routes[0];if(rt&&rt.geometry&&rt.geometry.coordinates.length){ex={coords:conv(rt.geometry.coordinates),dist:rt.distance||0,dur:0,src:"OSRM"};break}
    }catch(err){log("Router error: "+err.message)}}}
  if(ex&&ex.dist>straight*4&&ex.dist>2000){log("Route unrealistically long.");ex=null}
  if(ex){routeCoords=ex.coords;drawRoute("#0b7285")}
  else{routeCoords=simpleRoute(s,e);drawRoute("#12a150");toast("No road route found. Using a straight-line practice path.")}
  routeCum=computeCum(routeCoords);routeDistM=routeCum[routeCum.length-1];simIndex=0;
  const mins=ex&&ex.dur?Math.round(ex.dur/60):Math.round(routeDistM/1000/(car?30:15)*60);
  $("sum").hidden=false;$("sumKm").textContent=fmtKm(routeDistM);$("sumMin").textContent=Math.max(1,mins)+" min";$("sumPts").textContent=ex?ex.src:"Straight";
  log(`${car?"Car":"Bike"} route via ${ex?ex.src:"fallback"}: ${routeCoords.length} pts`);
  b.textContent="Get route again";
  if(connected())initWindow(routeCoords);
  refresh()};

$("resendBtn").onclick=()=>{if(!connected())return toast("Connect the bike first.");if(!routeCoords.length)return toast("Get a route first.");initWindow(routeCoords);toast("Map sent to bike.")};
$("testBtn").onclick=()=>{if(!connected())return toast("Connect the bike first.");if(!routeCoords.length)return toast("Get a route first.");sendJson(JSON.stringify(buildUpdate(0,true,null))).then(()=>toast("Test packet sent.")).catch(e=>toast("Send failed: "+e.message))};

/* ---------- ride ---------- */
function hud(u,src){$("hArrow").textContent=ARROWS[u.turn]||"\u2191";$("hDist").textContent=u.turn===6?"Arrived":fmtKm(u.dist);$("hRoad").textContent=u.road;$("hSpd").textContent=Math.round(u.spd);
  $("hLeft").textContent=fmtKm(Math.max(0,routeDistM-(routeCum[simIndex]||0)));$("hSrc").textContent=src}
async function lockScreen(){try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}}
function stopRide(silent){
  if(simTimer){clearInterval(simTimer);simTimer=null}
  if(liveId!=null){navigator.geolocation.clearWatch(liveId);liveId=null}
  if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null}
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
  if(document.body.classList.contains("riding")&&!silent)toast("Ride ended.");
  document.body.classList.remove("riding");updateDock()}
$("stopBtn").onclick=()=>stopRide();
$("rideBtn").onclick=()=>{
  if(!connected())return toast("Connect the bike first.");if(!routeCoords.length)return toast("Get a route first.");
  if(!fullPts.length)initWindow(routeCoords);
  document.body.classList.add("riding");updateDock();lockScreen();simIndex=0;
  mode==="sim"?startSim():startLive()};

function closestIdx(lat,lon,cur){let best=cur,min=Infinity;const a=Math.max(0,cur-20),b=Math.min(routeCoords.length,cur+150);
  for(let i=a;i<b;i++){let d=haversine({lat,lon},routeCoords[i]);if(i<cur)d+=10;if(d<min){min=d;best=i}}
  return min>100?cur:best}
function startLive(){
  if(!navigator.geolocation){toast("This browser has no GPS support.");return stopRide(true)}
  toast("Waiting for a GPS fix...");
  liveId=navigator.geolocation.watchPosition(pos=>{
    const{latitude:lat,longitude:lon,accuracy,speed}=pos.coords;let heading=pos.coords.heading;
    if(accuracy>30)return;
    if(!gpsMarker)gpsMarker=L.circleMarker([lat,lon],{color:"#fff",fillColor:"#1971ff",fillOpacity:1,weight:3,radius:8}).addTo(map);else gpsMarker.setLatLng([lat,lon]);
    map.panTo([lat,lon],{animate:true});
    const kmh=speed!=null&&speed>=0?speed*3.6:0;let ni=closestIdx(lat,lon,simIndex);if(Math.abs(ni-simIndex)>50)ni=simIndex;simIndex=ni;
    if(kmh<2||heading==null||isNaN(heading))heading=bearing(routeCoords[simIndex],routeCoords[Math.min(simIndex+1,routeCoords.length-1)]);
    const u=buildUpdate(simIndex,false,kmh);u.hdg=Math.round(heading*10)/10;
    sendJson(JSON.stringify(u)).catch(e=>log("Send: "+e.message));checkUpdate(simIndex);hud(u,"Live GPS \u00B1"+Math.round(accuracy)+" m")},
    err=>{toast("GPS error: "+err.message)},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function startSim(){
  simDistM=0;simSpd=0;simLastTs=performance.now();
  gpsMarker=L.circleMarker([routeCoords[0].lat,routeCoords[0].lon],{color:"#fff",fillColor:"#ff6a1f",fillOpacity:1,weight:3,radius:8}).addTo(map);
  simTimer=setInterval(async()=>{
    if(sending)return;sending=true;
    try{const now=performance.now();let dt=clamp((now-simLastTs)/1000,.05,.6);simLastTs=now;
      const mult=parseFloat($("mult").value)||10,total=routeCum[routeCum.length-1]||1,tgt=plannedSpeed(simIndex)/3.6*mult,nr=simDistM+tgt*dt;let nd;
      if(nr>=total){nd=0;simIndex=0;simSpd=tgt*3.6;chunkEnd=0;sendChunk(0)}
      else{nd=nr;let ni=simIndex;while(ni+1<routeCoords.length&&routeCum[ni+1]<=nd)ni++;simSpd+=((Math.abs(nd-simDistM)/dt)*3.6-simSpd)*.3;simIndex=ni}
      simDistM=nd;const u=buildUpdate(simIndex,false,simSpd);
      gpsMarker.setLatLng([u.lat,u.lon]);hud(u,"Practice "+mult+"x");
      await sendJson(JSON.stringify(u));checkUpdate(simIndex)
    }catch(e){toast("Practice stopped: "+e.message);stopRide(true)}finally{sending=false}},400)}

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&document.body.classList.contains("riding"))lockScreen()});
/* dock */
function updateDock(){
  const r=document.body.classList.contains("riding"),c=connected(),has=routeCoords.length>0;
  $("dBle").classList.toggle("on",c);$("dBle").title=c?"Disconnect bike":"Connect bike";
  $("dRoute").classList.toggle("on",has);$("dRoute").classList.toggle("dim",!(startM&&endM)&&!has);
  $("dRide").classList.toggle("live",r);$("dRide").classList.toggle("dim",!r&&!(has&&c));
  $("dRide").title=r?"End ride":"Start ride";
  $("dRideIco").innerHTML=r?'<rect x="6" y="6" width="12" height="12" rx="2"/>':'<path d="M7 4l13 8-13 8z"/>'}
function expand(open){const m=!open;$("sheet").classList.toggle("min",m);$("minBtn").innerHTML=m?"&#9633;":"&#8212;"}
$("dBle").onclick=()=>$("bleBtn").click();
$("dRoute").onclick=()=>{if(!(startM&&endM))return toast("Tap the map to set a start, then a destination.");$("routeBtn").click()};
$("dRide").onclick=()=>{if(document.body.classList.contains("riding"))return stopRide();$("rideBtn").onclick()};
$("dSet").onclick=()=>expand(true);
$("minBtn").onclick=()=>expand(false);
updateDock();
/* vehicle + ORS key */
let vehicle="bike";
try{vehicle=localStorage.getItem("bn_veh")||"bike";$("orsKey").value=localStorage.getItem("bn_ors")||""}catch(e){}
function paintVeh(){document.querySelectorAll("#vehSeg button").forEach(x=>x.classList.toggle("act",x.dataset.v===vehicle))}
document.querySelectorAll("#vehSeg button").forEach(b=>b.onclick=()=>{if(vehicle===b.dataset.v)return;vehicle=b.dataset.v;paintVeh();try{localStorage.setItem("bn_veh",vehicle)}catch(e){}
  if(routeCoords.length){clearRoute();refresh();toast("Switched to "+vehicle+". Get the route again.")}});
$("orsKey").onchange=()=>{try{localStorage.setItem("bn_ors",$("orsKey").value.trim())}catch(e){}toast("Routing key saved.")};
paintVeh();
refresh();
</script>
